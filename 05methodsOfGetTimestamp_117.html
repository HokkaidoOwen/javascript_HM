<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 methods of get timestamp</title>
</head>

<body>

  <script>
    //1.getTime()
    const date = new Date()
    console.log(date);

    //2.+new Date()
    console.log(+new Date());
    console.log('-------------');
    console.log(+new Date('2025-3-11 11:11:11'));

    //get weeksday

    const arr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
    console.log(arr[new Date().getDay()]);


    //3.Date.now()
    console.log(Date.now());
  </script>
</body>

</html>
