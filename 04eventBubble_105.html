<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Bubble</title>
  <style>
    .father {
      width: 400px;
      height: 240px;
      background-color: orange;
    }

    .son {
      width: 200px;
      height: 120px;
      background-color: darkred;
    }
  </style>
</head>

<body>

  <div class="father">
    <div class="son"></div>
  </div>
  <script>
    const fa = document.querySelector('.father')
    const son = document.querySelector('.son')
    // 2 event bubble  
    //default is event bubble
    // document.addEventListener('click', function () {
    //   alert('Grandfather')
    // })
    // fa.addEventListener('click', function () {
    //   alert('father')
    // })
    // son.addEventListener('click', function () {
    //   alert('son')
    // })

    //3 prevent event bubble  
    // stopPropagation
    // int stopPropagation also can prevent event capturing

    document.addEventListener('click', function () {
      alert('Grandfather')
    })
    fa.addEventListener('click', function () {
      alert('father')
    })
    son.addEventListener('click', function (e) {
      alert('son')
      e.stopPropagation()
    })
  </script>
</body>

</html>
