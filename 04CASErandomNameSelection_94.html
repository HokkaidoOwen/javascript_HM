<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASE Random Name Selection</title>
  <style>
    * {

    h2 {

    .box {
      width: 600px;
      margin: 50px auto;
      display: flex;

    }

    .qs {
      width: 450px;
      height: 40px;

    }

      text-align: center;
    }

    .btns button {
      width: 120px;
      height: 35px;
      margin: 0 50px;
    }
  </style>
</head>

<body>
  <h2> Random Name Selection</h2>
  <div class="box">
    <span>The name is:</span>
    <div class="qs">there displays name</div>
  </div>
  <div class="btns">
    <button class="start">START</button>
    <button class="end">END</button>
  </div>

  <script>

      'MC', 'HZ', 'ZY', 'GY', 'ZF', 'Owen', 'Biden', 'Trump', 'Elon'
    ]

    // const question = document.querySelector('.question');

    // //start event
    // btnEnd.addEventListener('click', function () {

    let timerId = 0;
    let random = 0;

    //1.  start button part 
    const qs = document.querySelector('.qs')
    //get start button
    const start = document.querySelector('.start');
    start.addEventListener('click', function () {
      timerId = setInterval(function () {
        random = parseInt(Math.random() * arrQ.length)
        qs.innerHTML = arrQ[random]
      }, 35)

      if (arrQ.length === 1) {
        // start.disabled = true
        // end.disabled = true

        start.disabled = end.disabled = true;
      }
    })

    //2. end button part 
    const end = document.querySelector('.end')
    end.addEventListener('click', function () {
      clearInterval(timerId);
      arrQ.splice(random, 1)
    })

  </script>
