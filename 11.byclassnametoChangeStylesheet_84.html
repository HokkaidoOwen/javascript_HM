<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>classname to change CSS</title>
  <style>
    div {
      width: 200px;
      height: 200px;
      background-color: black;
    }

    .nav {
      color: aqua;
    }

    .box {
      width: 300px;
      height: 300px;
      background-color: pink;
      margin: 100px auto;
      padding: 10px;
      border: 2px solid yellow;
    }
  </style>
</head>

<body>
  <div class="nav">
    123
  </div>
  <script>
    // step1 get element
    const div = document.querySelector('div')

    // step2 by className
    div.className = 'box'; // 此时原来的nav就没了

    // but 如果想要同时实现.box and .nav 的 stylesheets
    div.className = 'box nav'

  </script>
</body>

</html>
