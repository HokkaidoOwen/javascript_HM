<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Selector</title>
  <style>
    input[value] {
      color: aqua;
    }
  </style>
</head>

<body>

  <input type="text" value="666" data-id="0" data-name="Andy">
  <input type="password">
  <script>
    const input = document.querySelector('input[value]')

    console.log(input.dataset);
    console.log(input.dataset.name);

  </script>
</body>

</html>
