<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>the usage of Date Objection's Methods </title>
</head>

<body>
  <script>

    //1.first get date obj
    const date = new Date()

    //2.use Methods
    console.log(date.getFullYear());
    console.log(date.getMonth() + 1);
    console.log(date.getDate());
    console.log(date.getDay());





  </script>

</body>

</html>
