<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel session1</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .slider {
      width: 500px;
      height: 400px;
      overflow: hidden;
    }

    .slider-wrapper {
      width: 100%;
      height: 320px;
    }

    .slider-wrapper img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-footer {
      height: 80px;
      background-color: rgb(100, 67, 68);
      padding: 12px 12px 0 12px;
      position: relative;
    }

    .slider-footer .toggle {
      position: absolute;
      right: 0;
      top: 12px;
      display: flex;
    }

    .slider-footer .toggle button {
      margin-right: 12px;
      width: 28px;
      height: 28px;
      appearance: none;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-footer .toggle button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .slider-footer p {
      margin: 0;
      color: #fff;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .slider-indicator {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      align-items: centers;
    }

    .slider-indicator li {
      width: 8px;
      height: 8px;
      margin: 4px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.4;
      cursor: pointer;
    }

    .slider-indicator li.active {
      width: 12px;
      height: 12px;
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="slider">
    <div class="slider-wrapper">
      <img src="./img/blackCar.jpeg" alt="">
    </div>
    <div class="slider-footer">
      <p>NMSL</p>
      <ul class="slider-indicator">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
      <div class="toggle">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>

      </div>
    </div>
  </div>
  <script>
    const arrImg = [
      { url: './img/blackCar.jpeg', title: 'title1', color: 'rgb(100,67,68)' },
      { url: './img/dusk.jpeg', title: 'title2', color: 'rgb(43,37,38)' },
      { url: './img/GT4Wfa8XQAAhgws.jpeg', title: 'title3', color: 'rgb(140,66,86)' },
      { url: './img/GTqdqhjacAARQ2y.jpeg', title: 'title4', color: 'rgb(34,50,43)' },
      { url: './img/GU14GBBaIAA71SB.jpeg', title: 'title5', color: 'rgb(50,4,54)' },
      { url: './img/GU18Tkla4AEXzl0.jpeg', title: 'title6', color: 'rgb(1,13,14)' },
      { url: './img/GUn3_V8aYAA2bEW.jpeg', title: 'title7', color: 'rgb(50,6,56)' },
      { url: './img/GUrltyWbsAAhpU5.jpeg', title: 'title8', color: 'rgb(200,7,207)' }
    ]

    let random = parseInt(Math.random() * arrImg.length);

    const img = document.querySelector('.slider-wrapper img')
    img.src = arrImg[random].url;

    const p = document.querySelector('.slider-footer p')
    p.innerHTML = arrImg[random].title;

    //这里要注意random+1
    const li = document.querySelector(`.slider-indicator li:nth-child(${random + 1})`);
    li.classList.add('active')
  </script>
</body>

</html>
