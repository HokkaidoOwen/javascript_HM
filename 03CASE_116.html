    // M1 of teacher
    const div = document.querySelector('div')
    function getMydate() {
      const date = new Date()
      let h = date.getHours()
      let m = date.getMinutes()
      let s = date.getSeconds()
      h = h < 10 ? '0' + h : h;
      m = m < 10 ? '0' + m : m;
      s = s < 10 ? '0' + s : s;

      return `Now is ${date.getFullYear()}year${date.getMonth() + 1} month ${date.getDate()}  ${h}:${m}:${s}`;
    }
    div.innerHTML = getMydate();

    setInterval(function () {
      div.innerHTML = getMydate();

    }, 1000);
