<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unbinding Event</title>
</head>

<body>
  <button>click</button>
  <script>
    const btn = document.querySelector('button')

    // // L0 event  Unbinding Event
    // btn.onclick = function () {
    //   alert('clicked!!!')
    //   btn.onclick = null
    // }
    // // btn.onclick = null

    // L2 event Unbinding Event
    //anonymous functions can not be unbinded
    //so first make fun
    function fn() {
      alert('L2 Unbinding')
    }

    btn.addEventListener('click', fn)
    btn.removeEventListener('click', fn)

  </script>
</body>

</html>
