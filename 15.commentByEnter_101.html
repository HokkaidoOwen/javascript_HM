<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment by Enter</title>
  <style>
    .wrapper {
      min-width: 400px;
      max-width: 800px;
      display: flex;
      justify-content: flex-end;

    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: url(./img/dusk.jpeg) no-repeat center/cover;
      margin-right: 20px;
    }

    .wrapper textarea {
      outline: none;
      border-color: transparent;
      resize: none;
      background: #f5f5f5;
      border-radius: 4px;
      flex: 1;
      padding: 10px;
      transition: all 0.5s;
      height: 30px;
    }

    .wrapper textarea:focus {
      border-color: #e4e4e4;
      background: #fff;
      height: 50px;
    }

    .wrapper button {
      background: #00aeec;
      color: #fff;
      border: none;
      border-radius: 4px;
      margin-left: 10px;
      width: 70px;
      cursor: pointer;
    }

    .wrapper .total {
      margin-right: 80px;
      color: #999;
      margin-top: 5px;
      opacity: 0;
      transition: all 0.5s;
    }

    .list {
      min-width: 400px;
      max-width: 800px;
      display: flex;
    }

    .list .item {
      width: 100%;
      display: flex;
    }

    .list .item .info {
      flex: 1;
      border-bottom: 1px dashed #e4e4e4;
      padding-bottom: 10px;
    }

    .list .item p {
      margin: 0;
    }

    .list .item .name {
      color: #fb7299;
      font-size: 14px;
      font-weight: bold;
    }

    .list .item .text {
      color: #333;
      padding: 10px 0;

    }

    .list .item .time {
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <i class="avatar"></i>
    <textarea id="tx" placeholder="send one friendly comment" rows="2" maxlength="200"></textarea>
    <button>SEND</button>
  </div>
  <div class="wrapper">
    <span class="total">0/200 words</span>
  </div>
  <div class="list">
    <div class="item" style="display: none;">
      <i class="avatar"></i>
      <div class="info">
        <p class="name">user name</p>
        <p class="text">Thanks you</p>
        <p class="time">2022-10-10 20:29:21</p>
      </div>
    </div>
  </div>

  <script>
    // const textarea = document.querySelector('textarea');
    // console.log(textarea);

    // const total = document.querySelector('.total')
    // console.log(total);

    const tx = document.querySelector('#tx')
    const total = document.querySelector('.total')


    //1. when textarea get focus, dispaly total
    tx.addEventListener('focus', function () {
      total.style.opacity = 1
    })

    //2.when textarea get blur ,does not display total
    tx.addEventListener('blur', function () {
      total.style.opacity = 0
    })

    //3.display words
    tx.addEventListener('input', function () {
      total.innerHTML = `${tx.value.length}/200 words`
    })


    // 4.按下enter 发布comment
    const item = document.querySelector('.item');
    console.log(item);

    const p = document.querySelector('.text')

    tx.addEventListener('keyup', function (e) {
      if (e.key === 'Enter') {
        if (tx.value.trim() !== '') {
          item.style.display = 'block'
          p.innerHTML = tx.value
        }

        tx.value = ''
        total.innerHTML = '0/200words'
      }
    })

  </script>
</body>

</html>
