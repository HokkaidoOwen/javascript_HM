<script>
  const btn = document.querySelector('.btn')
  let i = 6
  let n = setInterval(function () {
    i--;
    btn.innerHTML = `I have red (${i})`
    if (i === 0) {
      clearInterval(n);
      btn.innerHTML = `I have red `
      btn.disabled = false
    }
  }, 1000)
