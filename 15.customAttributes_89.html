<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>custom attributes</title>
</head>

<body>
  <div data-id="1" data-name="first">1</div>
  <div data-id="2" data-name="second">2</div>
  <div>3</div>
  <div>4</div>
  <div>5</div>

  <script>
    const one = document.querySelector('div')
    console.log(one.dataset);//get all custom attributes

    //but we want is id ,so
    console.log(one.dataset.id);

    // only want name 
    console.log(one.dataset.name);





  </script>
</body>

</html>
