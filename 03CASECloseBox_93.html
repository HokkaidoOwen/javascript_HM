<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASE CloseBox</title>
  <style>
    .box {
      position: relative;
      width: 1000px;
      height: 200px;
      background-color: pink;
      margin: 100px auto;
      text-align: center;
      font-size: 50px;
      line-height: 200px;
      font-weight: 700;
    }

    .boxclose {
      position: absolute;
      right: 20px;
      top: 10px;
      width: 20px;
      height: 20px;
      background-color: skyblue;
      text-align: center;
      line-height: 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>


<body>
  <div class="box">
    it is a AD
    <div class="boxclose">X</div>
  </div>
  <script>
    // 1. get event 源
    const box = document.querySelector('.box');
    const boxclose = document.querySelector('.boxclose');

    box.addEventListener('click', function () {
      box.style.display = 'none'
    })

  </script>
</body>

</html>
