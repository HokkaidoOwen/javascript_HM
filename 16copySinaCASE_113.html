<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASE: Copy Sina</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .content {
      /* display: none; */
      overflow: hidden;
      width: 1000px;
      height: 3000px;
      background-color: pink;
      margin: 0 auto;

    }

    .backtop {
      /* display: none; */
      width: 50px;
      left: 50%;
      margin: 0 0 0 505px;
      position: fixed;
      bottom: 60px;
      z-index: 100;

    }

    .backtop a {
      height: 50px;
      width: 50px;
      background: url(./img/dusk.jpeg) 0 -600px no-repeat;
      opacity: 0.35;
      overflow: hidden;
      display: block;
      text-indent: -999em;
      cursor: pointer;
    }

    .header {
      position: fixed;
      top: -80px;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: purple;
      text-align: center;
      color: #ffff;
      line-height: 80px;
      font-size: 30px;
      transition: all .33;
    }

    .sk {
      width: 300px;
      height: 300px;
      background-color: skyblue;
      margin-top: 500px;
    }
  </style>
</head>

<body>
  <div class="header">header</div>
  <div class="content">
    <div class="sk">秒杀</div>
  </div>
  <div class="backtop">
    <img src="./img/blackCar.jpeg" alt="">
    <a href="#"></a>
  </div>
  <script>
    const sk = document.querySelector('.sk')
    const header = document.querySelector('.header')

    window.addEventListener('scroll', function () {
      const n = document.documentElement.scrollTop
      // m1 
      if (n >= sk.offsetTop) {
        header.style.top = 0
      } else {
        header.style.top = '-80px'
      }

      //m2 
      header.style.top = n >= sk.offsetTop ? 0 : '-80px'
    })
  </script>
</body>

</html>
